{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>MyBlog</h1>
            <p>Дизайн, технологии и вдохновение</p>
        </header>

        <nav class="sidebar">
            <ul>
                <li><a href="{% url 'home' %}">Главная</a></li>
                <li><a href="{% url 'about' %}">О блоге</a></li>
                <li><a href="{% url 'post' %}">Публикация</a></li>
                <li><a href="{% url 'reviews' %}">Книга отзывов</a></li>
            </ul>
        </nav>

        <main class="content">
            {% block content %}
            {% endblock %}
        </main>
    </div>
</body>
</html>
